repos:
  - repo: https://github.com/Yelp/detect-secrets
    # v1.5.0
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        exclude: ^pnpm-lock\.yaml$
      - id: detect-secrets
        name: Detect secret keywords in pnpm lockfile
        files: ^pnpm-lock\.yaml$
        args:
          - --disable-plugin
          - Base64HighEntropyString
          - --disable-plugin
          - HexHighEntropyString
  - repo: local
    hooks:
      - id: generic-credential-tree
        name: Detect generic credential literals
        entry: python tools/security/scan_git_history.py --tree
        language: system
        pass_filenames: false
      - id: generic-credential-history
        name: Detect generic credentials in a commit range
        entry: python tools/security/scan_git_history.py
        language: system
        pass_filenames: false
        stages: [manual]
