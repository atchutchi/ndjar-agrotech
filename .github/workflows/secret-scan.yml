name: Secret scan

on:
  push:

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Detect secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      - name: Scan generic credentials in the current tree
        run: python tools/security/scan_git_history.py --tree
      - name: Scan every new commit in the push
        env:
          NDJAR_SECRET_SCAN_BASE: ${{ github.event.before }}
          NDJAR_SECRET_SCAN_HEAD: ${{ github.sha }}
        run: python tools/security/scan_git_history.py --base "$NDJAR_SECRET_SCAN_BASE" --head "$NDJAR_SECRET_SCAN_HEAD"
