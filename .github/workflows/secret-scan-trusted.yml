name: Trusted secret scan

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Detect secrets from protected base
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout protected base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Preserve protected configuration
        run: cp .pre-commit-config.yaml "$RUNNER_TEMP/trusted-pre-commit-config.yaml"
      - name: Checkout pull request content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Scan with protected configuration
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --config ${{ runner.temp }}/trusted-pre-commit-config.yaml detect-secrets --all-files
